name: Sond — prisarkeologi (historik ur webbarkivet)

# Kan vi läsa en leverantörs prishistorik ur webbarkivet? Maktkalendern kräver 3 verifierade
# höjningar per leverantör och har noll. Arkivet bär leverantörens egen prissida, tidsstämplad
# av tredje part — skillnaden mellan två ögonblicksbilder ÄR en prisändring med datum.
on:
  workflow_dispatch:
    inputs:
      leverantor:
        description: 'Leverantörens namn'
        required: true
      url:
        description: 'Prissidans adress (den som ska sökas i arkivet)'
        required: true
      fran:
        description: 'Från vilket år'
        default: '2021'
      max:
        description: 'Max antal innehållsversioner att ladda'
        default: '40'

permissions:
  contents: read

jobs:
  sond:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Playwright + Chromium
        run: npm install playwright && npx playwright install chromium --with-deps
      - name: Gräv i arkivet
        id: matning
        shell: bash
        env:
          ARK_LEVERANTOR: ${{ inputs.leverantor }}
          ARK_URL: ${{ inputs.url }}
          ARK_FRAN: ${{ inputs.fran }}
          ARK_MAX: ${{ inputs.max }}
        # pipefail: utan den är stegets exit-kod tee:s (alltid 0) — en död sond rapporterar framgång.
        run: |
          set -o pipefail
          mkdir -p ops/prisarkeologi
          namn=$(echo "${{ inputs.leverantor }}" | tr '[:upper:] ' '[:lower:]-' | tr -cd 'a-z0-9-')
          # Före sonden: dör den skrivs ändå sökvägen, och uppladdningen tar det som hann skrivas.
          echo "fil=ops/prisarkeologi/$namn.txt" >> "$GITHUB_OUTPUT"
          node scripts/probe-prisarkeologi.mjs 2>&1 | tee "ops/prisarkeologi/$namn.txt"
      - name: Spara utfallet som artefakt
        # main tar bara emot PR:er (PR #80). Saknas filen blir steget rött (MP-03).
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: probe-prisarkeologi-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.matning.outputs.fil }}
          if-no-files-found: error
          retention-days: 90
