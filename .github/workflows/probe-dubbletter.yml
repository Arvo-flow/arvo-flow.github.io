name: Probe dubbletter

# Mäter prisbokens DOKUMENTIDENTITET före dedupliceringen (grundarmandat 2026-09-10, steg 1).
# Inga skrivningar, ingen push. Utskriften bär bara kategori/segment/belopp/antal — aldrig
# adresser, fingerprints eller hashar (repot är publikt och Actions-loggen med det).
# workflow_dispatch kan inte nå en workflow som ännu inte finns på default-branchen (GitHubs
# regel, mätt: 404 på dispatches). Push-triggern är den enda vägen härifrån — samma git-väg som
# inspect-analyses redan använder när API:t inte räcker.
on:
  workflow_dispatch:
    inputs:
      fonster:
        description: 'Tidsfönster i sekunder för korsningen mot invoice_analyses'
        required: false
        default: '30'
  push:
    paths:
      - 'scripts/probe-dubbletter.mjs'
      - 'scripts/probe-motpart.mjs'
      - '.github/workflows/probe-dubbletter.yml'

jobs:
  probe:
    name: Dokumentidentitet i prisboken
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      - name: Mät
        run: node scripts/probe-dubbletter.mjs "${{ inputs.fonster || '30' }}"
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
      - name: Motpartens tillstånd (kan korsningen göras alls?)
        run: node scripts/probe-motpart.mjs
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
