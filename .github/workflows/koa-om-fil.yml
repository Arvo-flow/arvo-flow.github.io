name: Köa om en fil
# Kör om EN namngiven fil från EN namngiven avsändare. Vägrar vid annat än exakt en träff.
on:
  workflow_dispatch:
    inputs:
      avsandare:
        description: 'Avsändaradress'
        required: true
      filnamn:
        description: 'Exakt filnamn (inga jokertecken)'
        required: true
jobs:
  koa:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - run: npm ci
      - run: node scripts/koa-om-fil.mjs "${{ inputs.avsandare }}" "${{ inputs.filnamn }}"
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          # Utan KV är markPending() en TYST NOLLHANDLING: getKv() returnerar null och funktionen
          # returnerar direkt. Jag lade in väckningen i skriptet och körde den sedan i en miljö där
          # den inte kunde väcka något — jobben låg pending med noll försök tills säkerhetsslotten
          # råkade fyra. Samma klass som felet väckningen skrevs för att laga.
          KV_REST_API_URL:   ${{ secrets.KV_REST_API_URL }}
          KV_REST_API_TOKEN: ${{ secrets.KV_REST_API_TOKEN }}
