name: Inspect analyses

# Läs-bar detaljgranskning av de senaste analyserna (för ingest-test-utvärdering). Inga DB-skrivningar.
# Triggas manuellt ELLER via en push till ops/inspect.trigger på main.
# Resultatet (ops/inspect-result.txt) står i loggen och laddas upp som artefakt. Läsvägen via
# git fetch är stängd sedan PR #80 (main tar bara emot PR:er); artefakten kräver Actions-API:t.
on:
  workflow_dispatch:
    inputs:
      n:
        description: 'Antal senaste analyser att visa'
        required: false
        default: '30'
  push:
    # Bara main: jobbet läser hemligheter i miljön produktion, som ingen annan gren når (HB-05).
    branches: [main]
    paths:
      - 'ops/inspect.trigger'

permissions:
  contents: read

jobs:
  inspect:
    environment: produktion
    name: Granska analyser
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm ci
      - name: Inspect
        run: |
          # pipefail: utan den är stegets exit-kod tee:s (alltid 0) — en död sond rapporterar framgång.
          set -o pipefail
          mkdir -p ops
          node scripts/inspect-analyses.mjs "${{ inputs.n || '40' }}" | tee ops/inspect-result.txt
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
      - name: Spara utfallet som artefakt
        # main tar bara emot PR:er (PR #80). Saknas filen blir steget rött (MP-03).
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: inspect-analyses-${{ github.run_id }}-${{ github.run_attempt }}
          path: ops/inspect-result.txt
          if-no-files-found: error
          retention-days: 90
