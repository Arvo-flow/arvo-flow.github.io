name: Live landing (hela sidan)
# Fotar HELA landningssidan mot skarpa sajten i båda lägen (exempel + personaliserat).
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/live-landing-full.mjs'
permissions:
  contents: write
jobs:
  shoot:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Playwright + Chromium
        run: |
          npm install --no-save playwright
          npx playwright install chromium --with-deps
      - name: Fota hela sidan
        run: |
          set -o pipefail
          mkdir -p ops/landing-full
          node scripts/live-landing-full.mjs 2>&1 | tee ops/landing-full/logg.txt
      # ── BEVISET FÅR INTE FÖRSVINNA TYST (2026-08-13) ────────────────────────────────────────
      # Version 1 var grön medan den inte pushade någonting: `git pull --rebase` avbröt på egna
      # ostagade filer, pushen förlorade kapplöpningen mot en samtidig körning, och
      # `|| echo "push miss"` svalde felet. Tre skärmdumpar togs och kastades.
      #
      # Version 2 (add → commit → rebase → push, med omförsök och ::error::) bytte en TYST
      # förlust mot en HÖGLJUDD — bättre, men fortfarande en förlust: två körningar som skjuter
      # nya PNG:er mot samma sökväg ger en BINÄRKONFLIKT i rebasen, och när rebasen väl står
      # olöst faller alla fem omförsöken på exakt samma tillstånd. Larmet var rätt; åtgärden fanns
      # inte.
      #
      # Version 3 tar bort konfliktbegreppet helt. Skärmdumpar är GENERERADE artefakter, inte
      # kod: det finns ingen sammanslagning att göra, senaste körningen vinner alltid. Vi flyttar
      # därför bara vår commit till toppen av main (`reset --soft`) och skriver om den med VÅRA
      # filer — ingen merge, ingen rebase, inget som kan hamna i ett halvläge.
      - name: Commit
        if: always()
        run: |
          git config user.email "bot@arvoflow.se"
          git config user.name "Arvo Diag Bot"
          git add ops/landing-full/
          git commit -m "ops: live-landing-full [skip ci]" || { echo "inget att committa"; exit 0; }
          for i in 1 2 3 4 5; do
            git fetch origin main
            git reset --soft FETCH_HEAD          # basen blir senaste main; våra filer står kvar
            git reset                             # avstaga allt — bara ops/ ska med
            git add ops/landing-full/
            if git diff --cached --quiet; then echo "identiskt med main — inget att pusha"; exit 0; fi
            git commit -m "ops: live-landing-full [skip ci]"
            git push origin HEAD:main && exit 0
            echo "försök $i misslyckades — väntar"; sleep $((i * 5))
          done
          echo "::error::skärmdumparna kunde inte pushas — beviset gick förlorat"
          exit 1
