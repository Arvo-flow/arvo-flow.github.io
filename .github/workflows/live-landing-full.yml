name: Live landing (hela sidan)
# Fotar HELA landningssidan mot skarpa sajten i båda lägen (exempel + personaliserat).
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/live-landing-full.mjs'
permissions:
  contents: read
jobs:
  shoot:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Playwright + Chromium
        run: |
          npm install --no-save playwright
          npx playwright install chromium --with-deps
      - name: Fota hela sidan
        run: |
          set -o pipefail
          mkdir -p ops/landing-full
          node scripts/live-landing-full.mjs 2>&1 | tee ops/landing-full/logg.txt
      # ── BEVISET FÅR INTE FÖRSVINNA TYST (2026-08-13) ────────────────────────────────────────
      # Version 1 svalde en nekad push med `|| echo "push miss"`; version 2 fastnade i binära
      # konflikter; version 3 skrev om sin commit ovanpå main. Version 3 sa redan det som gäller:
      # skärmdumpar är GENERERADE artefakter, inte kod. Sedan PR #80 tar main bara emot PR:er,
      # så version 4 laddar upp dem som artefakt och pushar ingenting.
      - name: Spara utfallet som artefakt
        # main tar bara emot PR:er (PR #80). Saknas filen blir steget rött (MP-03).
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-landing-full-${{ github.run_id }}-${{ github.run_attempt }}
          path: ops/landing-full/
          if-no-files-found: error
          retention-days: 30
