name: Diag avtal E2E (fem fällor mot live-kedjan)
# C1:s E2E-prov: grundarens fäll-avtal genom den LIVE-utlagda kedjan, maskindiffat mot facit.
# Självtriggar på push av skriptet/korpusen (OBS: aldrig [skip ci] i den utlösande committen).
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/diag-avtal-live.mjs'
      - 'test-pdfs/avtal/**'
permissions:
  contents: read
jobs:
  diag-avtal:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Vänta in Vercel-deployen av samma push
        run: sleep 100
      - name: Kör E2E-provet mot live
        run: |
          # pipefail: utan den är stegets exit-kod tee:s (alltid 0) — en död sond rapporterar framgång.
          set -o pipefail
          mkdir -p ops
          node scripts/diag-avtal-live.mjs | tee ops/diag-avtal-live.txt
      - name: Spara utfallet som artefakt
        # main tar bara emot PR:er (PR #80). Saknas filen blir steget rött (MP-03).
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diag-avtal-${{ github.run_id }}-${{ github.run_attempt }}
          path: ops/diag-avtal-live.txt
          if-no-files-found: error
          retention-days: 90
