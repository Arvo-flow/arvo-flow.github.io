name: Sond · stickprovet (vad påstår extraktionen, rad för rad?)
# Ett schemafält är ett LÖFTE om en observation, inte observationen. Sonden kör den skarpa
# extraktionen mot verkliga fakturor och räknar hur ofta fälten faktiskt fylls i — och hur många
# rader som därmed når fram till avstämningsgrinden. Utan den här mätningen vet vi bara att
# schemat ser komplett ut.
permissions:
  contents: read
on:
  workflow_dispatch:
jobs:
  sond:
    environment: produktion
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: |
          set -o pipefail
          node scripts/probe-stickprov.mjs 2>&1 | tee /tmp/stickprov.txt
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      # Inget continue-on-error: går mätningen förlorad ska körningen vara röd.
      - name: Spara utfallet som artefakt
        # main tar bara emot PR:er (PR #80). Saknas filen blir steget rött (MP-03).
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: probe-stickprov-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/stickprov.txt
          if-no-files-found: error
          retention-days: 90
