name: Inventory moat
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inv:
    environment: produktion
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      - name: Inventory
        run: |
          # pipefail: utan den är stegets exit-kod tee:s (alltid 0) — en död sond rapporterar framgång.
          set -o pipefail
          mkdir -p ops
          node scripts/inventory-moat.mjs | tee ops/inventory-moat.txt
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
      - name: Spara utfallet som artefakt
        # main tar bara emot PR:er (PR #80). Saknas filen blir steget rött (MP-03).
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: inventory-moat-${{ github.run_id }}-${{ github.run_attempt }}
          path: ops/inventory-moat.txt
          if-no-files-found: error
          retention-days: 90
