name: Sond · villkorsdokumenten (skärmning före kurering)
# Läser kandidatdokumenten och avgör kundtyp ur TEXTEN, aldrig ur filnamnet — bibelns
# Tele2-prejudikat kom av att ett dokument såg rätt ut på ytan och gällde privattjänster.
permissions:
  contents: write
on:
  workflow_dispatch:
jobs:
  sond:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save pdfjs-dist
      - run: |
          set -o pipefail
          node scripts/probe-villkorsdokument.mjs 2>&1 | tee /tmp/dok.txt
      # Inget continue-on-error: går beviset förlorat ska körningen vara röd.
      - name: Spara sondsvaret
        if: always()
        run: |
          git config user.email "bot@arvoflow.se"
          git config user.name "Arvo Diag Bot"
          for i in 1 2 3; do
            git fetch origin main
            git checkout -B sond origin/main
            mkdir -p ops && cp /tmp/dok.txt ops/probe-villkorsdokument.txt
            git add ops/probe-villkorsdokument.txt
            git commit -m "ops: sond villkorsdokument [skip ci]" || echo "inget nytt"
            if git push origin HEAD:main; then echo "sondsvaret sparat"; SPARAT=1; break; fi
            sleep $((i * 6))
          done
          [ "${SPARAT:-0}" = "1" ] || { echo "✗ sondsvaret kunde INTE sparas"; exit 1; }
