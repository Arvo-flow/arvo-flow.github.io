name: Sond · villkorsdokumenten (skärmning före kurering)
# Läser kandidatdokumenten och avgör kundtyp ur TEXTEN, aldrig ur filnamnet — bibelns
# Tele2-prejudikat kom av att ett dokument såg rätt ut på ytan och gällde privattjänster.
permissions:
  contents: read
on:
  workflow_dispatch:
jobs:
  sond:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save pdfjs-dist
      - run: |
          set -o pipefail
          node scripts/probe-villkorsdokument.mjs 2>&1 | tee /tmp/dok.txt
      # Inget continue-on-error: går beviset förlorat ska körningen vara röd.
      - name: Spara utfallet som artefakt
        # main tar bara emot PR:er (PR #80). Saknas filen blir steget rött (MP-03).
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: probe-villkorsdokument-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/dok.txt
          if-no-files-found: error
          retention-days: 90
