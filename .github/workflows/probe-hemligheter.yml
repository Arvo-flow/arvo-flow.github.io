name: Sond — GitHub-hemligheterna

# Skriver aldrig ett värde.
# sond (produktion): de hemligheter produktionsjobben behöver ska vara SATT.
# utan-miljo: VARJE hemlighet något arbetsflöde läser ska vara SAKNAS. Är någon SATT ligger den kvar
# som repository-hemlighet och når varje jobb som inte valt miljön — det är läckan. SV-21.
# Listorna här är låsta mot arbetsflödena och mot scripts/probe-hemligheter.mjs (HB-02).
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  utan-miljo:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --omit=dev
      - name: Repository-kopian ska vara borta
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ARVO_ADMIN_SECRET: ${{ secrets.ARVO_ADMIN_SECRET }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DROPBOX_AUTH_COOKIE: ${{ secrets.DROPBOX_AUTH_COOKIE }}
          KV_REST_API_TOKEN: ${{ secrets.KV_REST_API_TOKEN }}
          KV_REST_API_URL: ${{ secrets.KV_REST_API_URL }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_FROM: ${{ secrets.RESEND_FROM }}
        run: node scripts/probe-hemligheter.mjs --krav=saknas

  sond:
    environment: produktion
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci --omit=dev
      - name: Mät
        shell: bash
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ARVO_ADMIN_SECRET: ${{ secrets.ARVO_ADMIN_SECRET }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          KV_REST_API_URL: ${{ secrets.KV_REST_API_URL }}
          KV_REST_API_TOKEN: ${{ secrets.KV_REST_API_TOKEN }}
        run: |
          set -o pipefail
          node scripts/probe-hemligheter.mjs --krav=satt
          node scripts/probe-hemligheter.mjs
