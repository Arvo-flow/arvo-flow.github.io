name: Probe grindarna (falsklarmsfrekvens)

# Kör den SKARPA pipelinen mot hela test-pdfs/ och räknar hur ofta de avväpnade grindarna skulle
# fälla. Det är den mätning som saknats sedan 2026-06-10 — fixturkorpusen dömer på metric-nivå,
# grindarna på extraktionsnivå, och DB:n har bara 6 fakturor med radposter.
on:
  workflow_dispatch:
    inputs:
      max:
        description: 'Max antal fakturor (kostar ett modellanrop styck)'
        default: '999'
      filer:
        description: 'Kommaseparerade filnamn — kör bara dessa (för att borra i ett utfall)'
        default: ''

permissions:
  contents: read

jobs:
  probe:
    environment: produktion
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      - name: Kör grindmätningen
        run: |
          # pipefail: utan den är stegets exit-kod tee:s (alltid 0) — en död sond rapporterar framgång.
          set -o pipefail
          mkdir -p ops
          node scripts/probe-grindarna.mjs | tee ops/grindarna.txt
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GRIND_MAX: ${{ inputs.max }}
          GRIND_FILER: ${{ inputs.filer }}
      - name: Spara utfallet som artefakt
        # main tar bara emot PR:er (PR #80). Saknas filen blir steget rött (MP-03).
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: probe-grindarna-${{ github.run_id }}-${{ github.run_attempt }}
          path: ops/grindarna.txt
          if-no-files-found: error
          retention-days: 90
