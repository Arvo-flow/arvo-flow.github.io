name: Probe SaaS-priser (renderad rekognosering)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20', cache: npm }
      - name: Install Playwright + Chromium
        run: |
          # pipefail: utan den är stegets exit-kod tee:s (alltid 0) — en död sond rapporterar framgång.
          set -o pipefail
          npm ci
          npm install playwright
          npx playwright install chromium --with-deps
      - name: Probe
        continue-on-error: true
        run: |
          mkdir -p ops
          node scripts/probe-saas-render.mjs 2>&1 | tee ops/probe-saas-render.txt
      - name: Spara utfallet som artefakt
        # main tar bara emot PR:er (PR #80). Saknas filen blir steget rött (MP-03).
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: probe-saas-render-${{ github.run_id }}-${{ github.run_attempt }}
          path: ops/probe-saas-render.txt
          if-no-files-found: error
          retention-days: 90
