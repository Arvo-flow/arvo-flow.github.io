name: Verifiera deploy
on: { workflow_dispatch: {} }

# Att säga "ladda om" innan Vercel hunnit publicera är att göra grundaren till QA (regel 8).
# Workflowen frågar den SKARPA sajten — Actions har nät, sandlådan har det inte.
#
# Sedan 2026-08-15 räcker det inte att rutten lever: vi läser den utlagda JS-bundlen och letar
# efter de meningar ändringen faktiskt införde, plus de meningar den skulle TA BORT. En deploy
# som "gick igenom" utan att bära den nya copyn ser annars exakt ut som en lyckad deploy.
# OBS: bundlen escapar icke-ASCII (\xe4 osv) — markörerna nedan är därför medvetet ASCII-rena.
jobs:
  kolla:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Är fixarna ute?
        run: |
          set -e
          echo "── /api/invoice-history utan nycklar (ska ge 400, bevisar att rutten lever) ──"
          curl -s -o /tmp/r.json -w "status=%{http_code}\n" "https://arvoflow.se/api/invoice-history"
          cat /tmp/r.json; echo

          echo "── /api/test-invoice bootar? (pdfjs lades i produktionsbundlen 2026-08-15) ──"
          # Om bundlen spränger Vercels gräns dör HUVUDFUNNELN, inte rummet — och det syns inte
          # i någon annan kontroll här. GET ska ge 405 (endast POST stöds); allt annat, särskilt
          # 500 eller timeout, betyder att funktionen inte längre startar.
          TI=$(curl -s -o /dev/null -w "%{http_code}" https://arvoflow.se/api/test-invoice)
          echo "  status=$TI"
          if [ "$TI" != "405" ] && [ "$TI" != "400" ]; then
            echo "  ⛔ /api/test-invoice svarar $TI — funktionen bootar inte. FAKTURAANALYSEN ÄR NERE."
            exit 1
          fi
          echo "  ✓ analysfunktionen lever"

          echo "── hämtar utlagd bundle ──"
          BUNDLE=$(curl -s https://arvoflow.se/ | grep -o '/static/js/main\.[a-z0-9]*\.js' | head -1)
          echo "bundle: $BUNDLE"
          curl -s "https://arvoflow.se${BUNDLE}" -o /tmp/main.js
          wc -c /tmp/main.js

          FEL=0
          echo "── SKA FINNAS (rumsgranskningen 2026-08-15) ──"
          for s in "Ur er egen faktura" "fakturor prissatta" "Fler leverant" "vi kunde priss" "eget sk" \
                   "Marknadsankaret" "Vi skrev brevet" "Att beg" "i fyndet ovan" \
                   "verifierat " "faktura $"; do
            if grep -qF "$s" /tmp/main.js; then echo "  ✓ $s"; else echo "  ⛔ SAKNAS: $s"; FEL=1; fi
          done

          echo "── SKA VARA BORTA ──"
          for s in "mellan stolarna" "domen bygger pa nedan"; do
            if grep -qF "$s" /tmp/main.js; then echo "  ⛔ FINNS KVAR: $s"; FEL=1; else echo "  ✓ borta: $s"; fi
          done

          if [ "$FEL" = "1" ]; then
            echo ""
            echo "Deployen bär INTE den granskade versionen — be inte grundaren ladda om."
            exit 1
          fi
          echo ""
          echo "✓ Den utlagda sajten bär rumsgranskningens ändringar."

      - name: Kontext kring en oväntad träff
        if: failure()
        run: |
          BUNDLE=$(curl -s https://arvoflow.se/ | grep -o '/static/js/main\.[a-z0-9]*\.js' | head -1)
          curl -s "https://arvoflow.se${BUNDLE}" -o /tmp/main.js
          echo "── 200 tecken runt varje träff på 'mellan stolarna' ──"
          grep -o "mellan stolarna" /tmp/main.js | wc -l
          grep -o ".\{160\}mellan stolarna.\{60\}" /tmp/main.js | head -3
