name: Probe kandidatfält (vad vet bländaren redan?)
on:
  workflow_dispatch:
    inputs:
      domaner:
        description: 'Domäner, mellanslagsseparerade'
        default: 'avida.se'
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20', cache: npm }
      - run: npm ci --ignore-scripts
      - name: Probe
        continue-on-error: true
        run: |
          mkdir -p ops
          node scripts/probe-kandidatfalt.mjs ${{ inputs.domaner }} 2>&1 | tee ops/probe-kandidatfalt.txt
      - name: Commit
        if: always()
        continue-on-error: true
        run: |
          git config user.email "bot@arvoflow.se"
          git config user.name "Arvo Probe Bot"
          git add ops/probe-kandidatfalt.txt
          git commit -m "ops: probe-kandidatfalt [skip ci]" || echo "inget"
          git pull --rebase origin main || true
          git push origin HEAD:main || echo "push miss"
