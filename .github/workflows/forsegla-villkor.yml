name: Försegla villkorsboken (läst, aldrig gissad)
# Läser klausulen ORDAGRANT ur leverantörens PDF och förseglar endast vid träff.
# Misslyckas läsningen med ett tecken förblir posten röd — det är hela poängen.
# Förseglingen är en ändring i lib/ och går därför in via en PR med andra blick (Bevisplikten
# p.1): jobbet laddar upp den som patch-artefakt. Förut pushades den rakt till main, ogranskad.
on:
  workflow_dispatch:
    inputs:
      forsegla:
        description: 'Försegla lib/contract-intel.js och spara ändringen som patch-artefakt (annars bara läsning)'
        default: 'nej'
permissions:
  contents: read
jobs:
  las:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save pdfjs-dist
      - name: Läs klausulerna
        run: node scripts/forsegla-villkor.mjs ${{ github.event.inputs.forsegla == 'ja' && '--forsegla' || '' }}
      - name: Förseglingen som patch
        if: always() && github.event.inputs.forsegla == 'ja'
        run: |
          git diff -- lib/contract-intel.js > /tmp/forsegling.patch
          if [ -s /tmp/forsegling.patch ]; then cat /tmp/forsegling.patch; else echo "ingen försegling — lib/contract-intel.js är oförändrad"; fi

      - name: Spara utfallet som artefakt
        # main tar bara emot PR:er (PR #80). Saknas filen blir steget rött (MP-03).
        if: always() && github.event.inputs.forsegla == 'ja'
        uses: actions/upload-artifact@v4
        with:
          name: forsegla-villkor-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/forsegling.patch
          if-no-files-found: error
          retention-days: 30
