name: Probe Resend attachments

# Verifierar Resends bilage-listning mot den riktiga maskinen (RESEND_API_KEY): hårt tak vid 20
# eller opaginerad default? Skriver ops/probe-result.txt och laddar upp den som artefakt.
on:
  workflow_dispatch:
  push:
    # Bara main: jobbet läser hemligheter i miljön produktion, som ingen annan gren når (HB-05).
    branches: [main]
    paths:
      - 'ops/probe.trigger'

permissions:
  contents: read

jobs:
  probe:
    environment: produktion
    name: Probe Resend
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm ci
      - name: Probe
        run: |
          # pipefail: utan den är stegets exit-kod tee:s (alltid 0) — en död sond rapporterar framgång.
          set -o pipefail
          mkdir -p ops
          node scripts/probe-resend-attachments.mjs | tee ops/probe-result.txt
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      - name: Spara utfallet som artefakt
        # main tar bara emot PR:er (PR #80). Saknas filen blir steget rött (MP-03).
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: probe-resend-${{ github.run_id }}-${{ github.run_attempt }}
          path: ops/probe-result.txt
          if-no-files-found: error
          retention-days: 90
