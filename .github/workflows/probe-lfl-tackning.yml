name: Sond · LFL-täckning (hur ofta skapar gissningen ett tal?)
# Kör den SKARPA pipelinen på verkliga SaaS-fakturor och mäter hur ofta like-for-like-underlaget
# saknas — och om textgissningen då ändå producerar en kundsynlig besparing. Beslutsunderlag för
# om gissningsvägen ska tystas. En lokal funktions-diag kan ljuga genom utelämning; den här kör
# extract.js mot riktiga PDF:er med riktig nyckel.
permissions:
  contents: write
on:
  workflow_dispatch:
jobs:
  sond:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: |
          set -o pipefail
          node scripts/probe-lfl-tackning.mjs 2>&1 | tee /tmp/lfl.txt
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      # Inget continue-on-error: går mätningen förlorad ska körningen vara röd.
      - name: Spara sondsvaret
        if: always()
        run: |
          git config user.email "bot@arvoflow.se"
          git config user.name "Arvo Diag Bot"
          for i in 1 2 3; do
            git fetch origin main
            git checkout -B sond origin/main
            mkdir -p ops && cp /tmp/lfl.txt ops/probe-lfl-tackning.txt
            git add ops/probe-lfl-tackning.txt
            git commit -m "ops: sond LFL-täckning [skip ci]" || echo "inget nytt"
            if git push origin HEAD:main; then echo "sondsvaret sparat"; SPARAT=1; break; fi
            sleep $((i * 6))
          done
          [ "${SPARAT:-0}" = "1" ] || { echo "✗ sondsvaret kunde INTE sparas"; exit 1; }
