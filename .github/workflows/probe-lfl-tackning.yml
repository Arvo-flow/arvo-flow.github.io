name: Sond · LFL-täckning (hur ofta skapar gissningen ett tal?)
# Kör den SKARPA pipelinen på verkliga SaaS-fakturor och mäter hur ofta like-for-like-underlaget
# saknas — och om textgissningen då ändå producerar en kundsynlig besparing. Beslutsunderlag för
# om gissningsvägen ska tystas. En lokal funktions-diag kan ljuga genom utelämning; den här kör
# extract.js mot riktiga PDF:er med riktig nyckel.
permissions:
  contents: read
on:
  workflow_dispatch:
jobs:
  sond:
    environment: produktion
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: |
          set -o pipefail
          node scripts/probe-lfl-tackning.mjs 2>&1 | tee /tmp/lfl.txt
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      # Inget continue-on-error: går mätningen förlorad ska körningen vara röd.
      - name: Spara utfallet som artefakt
        # main tar bara emot PR:er (PR #80). Saknas filen blir steget rött (MP-03).
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: probe-lfl-tackning-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/lfl.txt
          if-no-files-found: error
          retention-days: 90
