name: Diag saas bugs

# Kör recommend() live på Microsoft + Google + en rätt-prissatt faktura och dumpar byte-mål +
# reasoning + Arvo Score → bevisar MS↔Google-motsägelsen och "alla 82" mot riktiga motorn.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diag:
    environment: produktion
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      - name: Diag
        run: |
          # pipefail: utan den är stegets exit-kod tee:s (alltid 0) — en död sond rapporterar framgång.
          set -o pipefail
          mkdir -p ops
          node scripts/diag-saas-bugs.mjs \
            test-pdfs/bulk26/INV_9917_Microsoft_Ireland.pdf \
            test-pdfs/bulk26/INV_9922_Google_Ireland_Ltd.pdf \
            test-pdfs/bulk26/INV_9908_Telavox_AB.pdf | tee ops/diag-saas-result.txt
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
      - name: Spara utfallet som artefakt
        # main tar bara emot PR:er (PR #80). Saknas filen blir steget rött (MP-03).
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diag-saas-bugs-${{ github.run_id }}-${{ github.run_attempt }}
          path: ops/diag-saas-result.txt
          if-no-files-found: error
          retention-days: 90
