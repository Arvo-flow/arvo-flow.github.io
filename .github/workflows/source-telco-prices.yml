name: Source telco prices
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  src:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Source
        run: |
          # pipefail: utan den är stegets exit-kod tee:s (alltid 0) — en död sond rapporterar framgång.
          set -o pipefail
          mkdir -p ops
          node scripts/source-telco-prices.mjs | tee ops/source-telco-prices.txt
      - name: Spara utfallet som artefakt
        # main tar bara emot PR:er (PR #80). Saknas filen blir steget rött (MP-03).
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: source-telco-prices-${{ github.run_id }}-${{ github.run_attempt }}
          path: ops/source-telco-prices.txt
          if-no-files-found: error
          retention-days: 90
