name: Diag Avslöjandet (verifiera /api/reveal live)

# POSTar kända domäner till den LIVE-utlagda /api/reveal och skriver fynden till ops/.
# Bevisar hela kedjan (affärshjärnan + DNS + RDAP + crt.sh) utlagd på Vercel.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diag-reveal:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Hit live /api/reveal
        run: |
          # pipefail: utan den är stegets exit-kod tee:s (alltid 0) — en död sond rapporterar framgång.
          set -o pipefail
          mkdir -p ops
          node scripts/diag-reveal.mjs | tee ops/diag-reveal-live.txt
      - name: Spara utfallet som artefakt
        # main tar bara emot PR:er (PR #80). Saknas filen blir steget rött (MP-03).
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diag-reveal-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ops/diag-reveal-live.txt
            ops/diag-reveal-live.json
          if-no-files-found: error
          retention-days: 90
