name: Probe Loopia priser

# Recon: publicerar Loopia SEK-listpriser för företag på öppen sida? Ren spaning, rör ingen prisbok.
# loopia.se är blockerad av sandlådans egress-proxy — den riktiga maskinen är GH Actions.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Playwright + Chromium
        run: |
          npm ci
          npm install playwright
          npx playwright install chromium --with-deps
      - name: Probe Loopia priser
        run: |
          # pipefail: utan den är stegets exit-kod tee:s (alltid 0) — en död sond rapporterar framgång.
          set -o pipefail
          mkdir -p ops
          node scripts/probe-loopia-priser.mjs 2>&1 | tee ops/probe-loopia-priser.txt
      - name: Spara utfallet som artefakt
        # main tar bara emot PR:er (PR #80). Saknas filen blir steget rött (MP-03).
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: probe-loopia-priser-${{ github.run_id }}-${{ github.run_attempt }}
          path: ops/probe-loopia-priser.txt
          if-no-files-found: error
          retention-days: 90
