name: Shot landing copy
# Fotar Landing-hero + prissektion mot live (regel 8-verifiering av copy-ändringar).
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/screenshot-landing-copy.mjs'
permissions:
  contents: write
jobs:
  shot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Playwright + Chromium
        run: |
          npm install --no-save playwright
          npx playwright install chromium --with-deps
      - name: Vänta in Vercel-deployen av samma push
        run: sleep 120
      - name: Fota
        run: |
          set -o pipefail
          mkdir -p ops/landing-copy-shots
          node scripts/screenshot-landing-copy.mjs 2>&1 | tee ops/landing-copy-shots/logg.txt
      - name: Commit
        if: always()
        continue-on-error: true
        run: |
          git config user.email "bot@arvoflow.se"
          git config user.name "Arvo Diag Bot"
          git pull --rebase origin main || true
          git add ops/landing-copy-shots/
          git commit -m "ops: landing-copy-shots [skip ci]" || echo "inget"
          git push origin HEAD:main || echo "push miss"
