name: Shot landing copy
# Fotar Landing-hero + prissektion mot live (regel 8-verifiering av copy-ändringar).
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/screenshot-landing-copy.mjs'
permissions:
  contents: read
jobs:
  shot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Playwright + Chromium
        run: |
          npm install --no-save playwright
          npx playwright install chromium --with-deps
      - name: Vänta in Vercel-deployen av samma push
        run: sleep 120
      - name: Fota
        run: |
          set -o pipefail
          mkdir -p ops/landing-copy-shots
          node scripts/screenshot-landing-copy.mjs 2>&1 | tee ops/landing-copy-shots/logg.txt
      - name: Spara utfallet som artefakt
        # main tar bara emot PR:er (PR #80). Saknas filen blir steget rött (MP-03).
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shot-landing-copy-${{ github.run_id }}-${{ github.run_attempt }}
          path: ops/landing-copy-shots/
          if-no-files-found: error
          retention-days: 30
