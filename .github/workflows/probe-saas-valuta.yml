name: Sond · SaaS-valuta (steg 0 för prisgrinden)
# Prisgrinden kan bara fyra när prisboken bär en rad i SAMMA valuta som fakturan (FX är förbjudet).
# saas-crm har i dag 4 rader, samtliga USD. Sonden svarar på om EUR/SEK-ankare ens existerar.
permissions:
  contents: read
on:
  workflow_dispatch:
jobs:
  sond:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright && npx playwright install chromium --with-deps
      - run: |
          set -o pipefail
          node scripts/probe-saas-valuta.mjs 2>&1 | tee /tmp/valuta.txt
      # Inget continue-on-error: går beviset förlorat ska körningen vara röd.
      - name: Spara utfallet som artefakt
        # main tar bara emot PR:er (PR #80). Saknas filen blir steget rött (MP-03).
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: probe-saas-valuta-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/valuta.txt
          if-no-files-found: error
          retention-days: 90
