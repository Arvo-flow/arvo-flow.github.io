name: Verify price sources (factory)

# EN workflow för HELA verifierar-fabriken. Job-matrisen härleds ur registryt
# (scripts/verify.mjs --matrix) → lägg till en verifierare i lib/verifiers/registry.mjs så
# vaktas den automatiskt här. Playwright/Chromium installeras bara för källor med needsBrowser.
# SCHEMAT ÅTERINFÖRT (grundarbeslut 2026-08-05, efter 21 inaktuella prisposter).
#
# Historik: schemat stängdes av 2026-07-20 för att körningen failade återkommande och spammade
# inkorgen. Det stoppade mejlen — men inte orsaken. Under de 16 dygn som följde höjde Microsoft
# Business Basic +16,6 %, Business Standard +12,0 %, E3 +8,3 %, E5 +5,3 % och Tele2 sin mobil
# +7–17 %, utan att någon såg det. Prisboken uppgav hela tiden de gamla talen som "verifierat
# listpris". Smyghöjningen — i vårt eget ankare, i den produkt som säljer skydd mot den.
#
# Läxan är inte "sätt på schemat igen" utan: ett larm som skriker på fel saker blir avstängt, och
# en avstängd vakt är värre än ingen vakt (den ser ut som att någon tittar). Därför kör schemat
# VECKOVIS och rött betyder nu exakt en sak: en källa har drivit eller är oåtkomlig. Det är ett
# sant larm och det ska komma. Blir det brusigt är svaret att laga verifieraren — aldrig att tysta den.
on:
  schedule:
    - cron: '0 4 * * 1'          # måndagar 06:00 CET — före veckans första kundanalyser
  workflow_dispatch:
    inputs:
      id:
        description: 'Kör en enskild källa (id) eller "all"'
        default: 'all'

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.gen.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - id: gen
        run: echo "matrix=$(node scripts/verify.mjs --matrix)" >> "$GITHUB_OUTPUT"

  verify:
    needs: discover
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        source: ${{ fromJson(needs.discover.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      # Cachar Chromium-binären (~177 MB) mellan körningar → browser-jobben slipper ladda ner
      # den varje gång (det var den som throttlade/segade ner fabriken). Cache-miss → install
      # laddar ner och sparar; cache-hit → install hittar den och hoppar nedladdningen.
      - name: Cache Playwright-browser (endast browser-källor)
        if: ${{ matrix.source.needsBrowser }}
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}
      - name: Install Playwright + Chromium (endast browser-källor)
        if: ${{ matrix.source.needsBrowser }}
        run: |
          npm ci
          npm install playwright
          npx playwright install chromium --with-deps
      # Stealth-källor (t.ex. Adobe bakom Akamai) behöver playwright-extra + stealth-plugin och körs headful.
      - name: Install stealth (endast needsStealth-källor)
        if: ${{ matrix.source.needsStealth }}
        run: npm install playwright-extra puppeteer-extra-plugin-stealth
      - name: Verifiera ${{ matrix.source.id }} (stealth, headful via xvfb)
        if: ${{ matrix.source.needsStealth }}
        run: HEADFUL=1 xvfb-run -a node scripts/verify.mjs ${{ matrix.source.id }}
      - name: Verifiera ${{ matrix.source.id }}
        if: ${{ !matrix.source.needsStealth }}
        run: node scripts/verify.mjs ${{ matrix.source.id }}
