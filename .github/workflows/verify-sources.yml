name: Verify price sources (factory)

# EN workflow för HELA verifierar-fabriken. Job-matrisen härleds ur registryt
# (scripts/verify.mjs --matrix) → lägg till en verifierare i lib/verifiers/registry.mjs så
# vaktas den automatiskt här. Playwright/Chromium installeras bara för källor med needsBrowser.
# SCHEMAT ÅTERINFÖRT (grundarbeslut 2026-08-05, efter 21 inaktuella prisposter).
#
# Historik: schemat stängdes av 2026-07-20 för att körningen failade återkommande och spammade
# inkorgen. Det stoppade mejlen — men inte orsaken. Under de 16 dygn som följde höjde Microsoft
# Business Basic +16,6 %, Business Standard +12,0 %, E3 +8,3 %, E5 +5,3 % och Tele2 sin mobil
# +7–17 %, utan att någon såg det. Prisboken uppgav hela tiden de gamla talen som "verifierat
# listpris". Smyghöjningen — i vårt eget ankare, i den produkt som säljer skydd mot den.
#
# Läxan är inte "sätt på schemat igen" utan: ett larm som skriker på fel saker blir avstängt, och
# en avstängd vakt är värre än ingen vakt (den ser ut som att någon tittar). Därför kör schemat
# VECKOVIS och rött betyder nu exakt en sak: en källa har drivit eller är oåtkomlig. Det är ett
# sant larm och det ska komma. Blir det brusigt är svaret att laga verifieraren — aldrig att tysta den.
on:
  schedule:
    - cron: '0 4 * * 1'          # måndagar 06:00 CET — före veckans första kundanalyser
  workflow_dispatch:
    inputs:
      id:
        description: 'Kör en enskild källa (id) eller "all"'
        default: 'all'

# Läsrätt räcker för alla jobb. Stämpeln når main via jobbet `stampla`, som checkar ut med en egen
# nyckel (BOT_DEPLOY_KEY) i miljön produktion — aldrig via GITHUB_TOKEN. Matrisjobben kör
# `npm install playwright-extra` (paket utanför låsfilen) och ska därför inte kunna skriva till repot.
permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.gen.outputs.matrix }}
      avtryck: ${{ steps.gen.outputs.avtryck }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      # Avtrycket av prisboken som matrisen verifierar, räknat här och inte i matrisen: det här jobbet
      # kör inga paket utanför låsfilen. Stämpeljobbet kräver att varje beslut bär just det (V2, SP-13).
      # Tilldelningen står på egen rad, så att ett fel fäller steget i stället för att bli en tom rad.
      - id: gen
        run: |
          echo "matrix=$(node scripts/verify.mjs --matrix)" >> "$GITHUB_OUTPUT"
          AVTRYCK=$(node scripts/stampla.mjs --avtryck)
          echo "avtryck=$AVTRYCK" >> "$GITHUB_OUTPUT"

  verify:
    needs: discover
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        source: ${{ fromJson(needs.discover.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      # Cachar Chromium-binären (~177 MB) mellan körningar → browser-jobben slipper ladda ner
      # den varje gång (det var den som throttlade/segade ner fabriken). Cache-miss → install
      # laddar ner och sparar; cache-hit → install hittar den och hoppar nedladdningen.
      - name: Cache Playwright-browser (endast browser-källor)
        if: ${{ matrix.source.needsBrowser }}
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}
      - name: Install Playwright + Chromium (endast browser-källor)
        if: ${{ matrix.source.needsBrowser }}
        run: |
          npm ci
          npm install playwright
          npx playwright install chromium --with-deps
      # Stealth-källor (t.ex. Adobe bakom Akamai) behöver playwright-extra + stealth-plugin och körs headful.
      - name: Install stealth (endast needsStealth-källor)
        if: ${{ matrix.source.needsStealth }}
        run: npm install playwright-extra puppeteer-extra-plugin-stealth
      - name: Verifiera ${{ matrix.source.id }} (stealth, headful via xvfb)
        if: ${{ matrix.source.needsStealth }}
        env:
          VERIFY_STAMPEL_UT: ${{ runner.temp }}/stampel-${{ matrix.source.id }}.json
        run: HEADFUL=1 xvfb-run -a node scripts/verify.mjs ${{ matrix.source.id }}
      - name: Verifiera ${{ matrix.source.id }}
        if: ${{ !matrix.source.needsStealth }}
        env:
          VERIFY_STAMPEL_UT: ${{ runner.temp }}/stampel-${{ matrix.source.id }}.json
        run: node scripts/verify.mjs ${{ matrix.source.id }}
      # ── STÄMPELN (2026-08-21, flyttad 2026-10-10) ────────────────────────────────────────
      # `lastVerified` uppdaterades bara när ett pris ÄNDRADES, så ett STABILT pris larmade i
      # price-audit efter 60 dagar — för alltid, hur många gånger vakten än bekräftat det.
      # verify.mjs bestämmer här, där bevisen finns, vilka datum en GRÖN vakt får flytta, och skriver
      # beslutet till en fil. Jobbet `stampla` nedan lägger på besluten och pushar — ett jobb, en
      # commit, en nyckel. Förr pushade varje matrisjobb själv, med `continue-on-error` och `exit 0`:
      # när grenskyddet på main kom (PR #80) nekades varje stämpel (GH006, körning 38090943472)
      # medan jobbet visade grönt.
      - name: Spara stämpelbeslutet
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stampel-${{ matrix.source.id }}
          path: ${{ runner.temp }}/stampel-${{ matrix.source.id }}.json
          if-no-files-found: ignore
          retention-days: 7

  stampla:
    name: Stämpla verifieringsdatum på main
    needs: [discover, verify]
    # ENDAST FRÅN main (2026-09-10): ett workflow_dispatch på en feature branch får aldrig skriva till
    # main. Röda källor stoppar inte de gröna: deras beslut läggs på ändå.
    if: always() && github.ref == 'refs/heads/main' && needs.verify.result != 'cancelled'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: produktion
    steps:
      # En katalog per artefakt (stampel-<id>/stampel-<id>.json). Med merge-multiple: true hamnade alla i
      # samma katalog, och en fil med en annan källas namn hade skrivit över den (tredje blickens V3, SP-14).
      - name: Hämta stämpelbesluten
        uses: actions/download-artifact@v4
        with:
          pattern: stampel-*
          path: ${{ runner.temp }}/stamplar
          merge-multiple: false
      - name: Finns det något att stämpla?
        id: finns
        run: |
          N=$(ls -d "${{ runner.temp }}/stamplar"/stampel-*/ 2>/dev/null | wc -l)
          echo "n=$N" >> "$GITHUB_OUTPUT"
          echo "$N beslutskatalog(er), en per verifierare som körde klart (en röd källas lista är tom)"
      # Utan nyckeln kan stämpeln inte nå main. Det är ett verkligt fel, alltså rött — aldrig grönt.
      - name: Botnyckeln finns i produktion
        if: steps.finns.outputs.n != '0'
        env:
          HAR_NYCKEL: ${{ secrets.BOT_DEPLOY_KEY != '' }}
        run: |
          if [ "$HAR_NYCKEL" != "true" ]; then
            echo "::error::BOT_DEPLOY_KEY saknas i miljön produktion — verifieringsdatumen kan inte nå main. Se ops/BOTNYCKELN.md."
            exit 1
          fi
      # Säger VAD som är fel med nyckeln innan git gör det med «Permission denied (publickey)», som ser
      # likadant ut oavsett orsak (2026-10-11, körning 38131322678). Fingeravtrycket är en hash av den
      # publika nyckeln och får skrivas ut; den privata nyckeln skrivs aldrig och filen raderas (SP-12).
      - name: Botnyckeln känns igen av GitHub
        if: steps.finns.outputs.n != '0'
        env:
          BOT_DEPLOY_KEY: ${{ secrets.BOT_DEPLOY_KEY }}
        run: |
          umask 077
          K="$RUNNER_TEMP/botnyckel"
          trap 'rm -f "$K" "$K.pub" "$K.hosts"' EXIT
          printf '%s\n' "$BOT_DEPLOY_KEY" > "$K"
          if ! ssh-keygen -y -f "$K" > "$K.pub" 2>/dev/null; then
            echo "::error::BOT_DEPLOY_KEY är ingen läsbar privat nyckel. Lägg in hela filen arvo-bot (inte arvo-bot.pub), med raderna BEGIN och END. Se ops/BOTNYCKELN.md."
            exit 1
          fi
          FP=$(ssh-keygen -lf "$K.pub")
          echo "Nyckelns fingeravtryck: $FP"
          SVAR=$(ssh -i "$K" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile="$K.hosts" -T git@github.com 2>&1 || true)
          echo "GitHub svarar: $SVAR"
          # Gemener med tr, inte ${X,,}: den formen finns först i bash 4, och SP-12 kör steget med
          # det lokala skalet (bash 3.2 på macOS, dash som sh). Fabrikssvepet 2026-10-17: SP-12 föll på Mac.
          REPO=$(printf '%s' "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')
          SMA=$(printf '%s' "$SVAR" | tr '[:upper:]' '[:lower:]')
          case "$SMA" in
            *"hi $REPO!"*) echo "✓ GitHub känner igen nyckeln som deploy key för $GITHUB_REPOSITORY" ;;
            *"hi "*) echo "::error::Nyckeln hör till något annat än $GITHUB_REPOSITORY. Lägg till arvo-bot.pub som deploy key i just det här repot. Se ops/BOTNYCKELN.md."; exit 1 ;;
            *) echo "::error::GitHub känner inte igen nyckeln ($FP). Jämför fingeravtrycket med Settings → Deploy keys: saknas nyckeln där, lägg till arvo-bot.pub; står ett annat fingeravtryck där, hör paren inte ihop — skapa ett nytt par och byt båda. Se ops/BOTNYCKELN.md."; exit 1 ;;
          esac
      - name: Checka ut main med botnyckeln
        if: steps.finns.outputs.n != '0'
        uses: actions/checkout@v4
        with:
          ref: main
          ssh-key: ${{ secrets.BOT_DEPLOY_KEY }}
      - uses: actions/setup-node@v4
        if: steps.finns.outputs.n != '0'
        with:
          node-version: '20'
      # Grenskyddet släpper igenom nyckeln, alltså avgör stampelvakt.mjs FÖRE varje push att commiten
      # bara flyttar lastVerified-datum framåt. En nekad push hämtar en färsk main och stämplar om —
      # ingen rebase, inga konflikter. Efter tre nekade försök är jobbet RÖTT.
      # Ref-villkoret här är TF-11:s form (varje steg som pushar till main bär det). Det som verkar är
      # jobbets villkor ovan: på en annan ref startar jobbet aldrig, så den här raden kan inte fälla något.
      - name: Committa, vakta och pusha
        if: steps.finns.outputs.n != '0' && github.ref == 'refs/heads/main'
        env:
          BESLUT: ${{ runner.temp }}/stamplar
          VERIFIERAD_AVTRYCK: ${{ needs.discover.outputs.avtryck }}
        run: |
          git config user.email "bot@arvoflow.se"
          git config user.name "Arvo Verify Bot"
          stampla() {
            UT=$(node scripts/stampla.mjs "$BESLUT") || return 2
            echo "$UT"
            git diff --quiet -- agents/recommender/branchindex.js && return 1
            git add agents/recommender/branchindex.js
            git commit -q -m "verifiering: gröna verifierare bekräftade sina nivåer mot källan [skip ci]" -m "$UT" || return 2
            node scripts/stampelvakt.mjs "$(git rev-parse HEAD~1)" || return 2
          }
          for i in 1 2 3; do
            r=0; stampla || r=$?
            if [ $r -eq 1 ]; then echo "inga datum att flytta (skälet står på stampla-raden ovan)"; exit 0; fi
            if [ $r -ne 0 ]; then exit 1; fi
            if git push origin HEAD:main; then echo "✓ stämpeln ligger på main"; exit 0; fi
            echo "push $i nekad — hämtar en färsk main och stämplar om"
            sleep $((i * ${STAMPEL_VANTA_S:-5}))
            # Var för sig: `fetch && reset` under bash -e lät en misslyckad fetch passera tyst, och nästa
            # varv läste den redan committade stämpeln som «inga datum att flytta» (tredje blickens V1, SP-07).
            git fetch -q origin main || { echo "::error::main gick inte att hämta efter en nekad push — stämpeln nådde inte main."; exit 1; }
            git reset -q --hard origin/main
          done
          echo "::error::stämpeln nekades av main tre gånger. Läs pushens felrad ovan: «GH006» = deploy keys saknar undantag i rulesetet, «read only» = kryssa i Allow write access på nyckeln (se ops/BOTNYCKELN.md)."
          exit 1
