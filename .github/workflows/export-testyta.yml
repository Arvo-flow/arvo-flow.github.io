name: Export testyta

# Dumpar testytans analyser (inkl health_score) till ops/testyta-rows.json så kontorsbilden
# kan renderas ur VERKLIG data.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    environment: produktion
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      - name: Export
        run: |
          mkdir -p ops
          node scripts/export-testyta.mjs > ops/testyta-rows.json
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
      - name: Spara utfallet som artefakt
        # main tar bara emot PR:er (PR #80). Saknas filen blir steget rött (MP-03).
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: export-testyta-${{ github.run_id }}-${{ github.run_attempt }}
          path: ops/testyta-rows.json
          if-no-files-found: error
          retention-days: 30
