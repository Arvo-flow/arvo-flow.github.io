name: Probe score vs underlag

# Mäter om Arvo Score och dess EGET underlag säger samma sak i rummet.
# Grundarens skärmdump 2026-08-19: score 92 + "RÄTT PRISSATT" rakt ovanför "Ni ligger 184 % över
# det billigaste priset". Sonden räknar om varje lagrad analys och rapporterar antalet rader där
# talet motsäger sitt eget bevis. Inga skrivningar till invoice_analyses.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      - name: Kör sonden
        run: |
          mkdir -p ops
          node scripts/probe-score-underlag.mjs | tee ops/score-underlag.txt
          node scripts/probe-grindmatning.mjs | tee ops/grindmatning.txt
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
      - name: Committa resultatet (läsbart via git)
        if: always()
        continue-on-error: true
        run: |
          git config user.email "bot@arvoflow.se"
          git config user.name "Arvo Probe Bot"
          git add ops/score-underlag.txt ops/grindmatning.txt
          git commit -m "ops: score-vs-underlag [skip ci]" || echo "inget att committa"
          git push origin HEAD:main || echo "push misslyckades"
