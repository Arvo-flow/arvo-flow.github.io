name: Probe score vs underlag

# Mäter om Arvo Score och dess EGET underlag säger samma sak i rummet.
# Grundarens skärmdump 2026-08-19: score 92 + "RÄTT PRISSATT" rakt ovanför "Ni ligger 184 % över
# det billigaste priset". Sonden räknar om varje lagrad analys och rapporterar antalet rader där
# talet motsäger sitt eget bevis. Inga skrivningar till invoice_analyses.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    environment: produktion
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      - name: Kör sonden
        run: |
          # pipefail: utan den är stegets exit-kod tee:s (alltid 0) — en död sond rapporterar framgång.
          set -o pipefail
          mkdir -p ops
          node scripts/probe-score-underlag.mjs | tee ops/score-underlag.txt
          node scripts/probe-grindmatning.mjs | tee ops/grindmatning.txt
          node scripts/probe-enhetsfelet.mjs | tee ops/enhetsfelet.txt
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
      - name: Spara utfallet som artefakt
        # main tar bara emot PR:er (PR #80). Saknas filen blir steget rött (MP-03).
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: probe-score-underlag-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ops/score-underlag.txt
            ops/grindmatning.txt
            ops/enhetsfelet.txt
          if-no-files-found: error
          retention-days: 90
