name: Sond · M365 Enterprise (finns publik E3/E5-prissida?)
# E3 och E5 står i prisboken men läses av INGEN verifierare — prisauditens täckningskontroll är
# på leverantörsnivå ('e3' → 'microsoft' → m365-verifieraren finns → grönt), vilket döljer att
# just de två tiers ingen maskin läser är bokens största tal. Sonden prövar om Microsoft
# publicerar priset på en publik sida, så att en verifierare kan byggas mot en BEVISAD adress.
permissions:
  contents: write
on:
  workflow_dispatch:
jobs:
  sond:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: |
          set -o pipefail
          node scripts/probe-m365-enterprise.mjs 2>&1 | tee /tmp/m365ent.txt
      # Inget continue-on-error: går mätningen förlorad ska körningen vara röd.
      - name: Spara sondsvaret
        if: always()
        run: |
          git config user.email "bot@arvoflow.se"
          git config user.name "Arvo Diag Bot"
          for i in 1 2 3; do
            git fetch origin main
            git checkout -B sond origin/main
            mkdir -p ops && cp /tmp/m365ent.txt ops/probe-m365-enterprise.txt
            git add ops/probe-m365-enterprise.txt
            git commit -m "ops: sond m365-enterprise [skip ci]" || echo "inget nytt"
            if git push origin HEAD:main; then echo "sondsvaret sparat"; SPARAT=1; break; fi
            sleep $((i * 6))
          done
          [ "${SPARAT:-0}" = "1" ] || { echo "✗ sondsvaret kunde INTE sparas"; exit 1; }
