name: Setup Price Database (run once)

# Engångsworkflow: skapar pristabellerna. Inga priser seedas: prisboken (agents/recommender/branchindex.js)
# är enda sanningen, och seedfilen med majpriser togs bort 2026-10-21.
# Kör manuellt från GitHub Actions → "Run workflow".
# Idempotent — säkert att köra flera gånger.

on:
  workflow_dispatch:

jobs:
  setup:
    environment: produktion
    name: Migrate price database
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Create price database schema
        run: node scripts/migrate-price-db.mjs
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Aggregate invoice benchmarks
        run: node scripts/aggregate-invoice-benchmarks.mjs
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
