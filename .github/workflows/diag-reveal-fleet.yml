name: Diag reveal fleet
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      - name: Reveal fleet
        run: |
          # pipefail: utan den är stegets exit-kod tee:s (alltid 0) — en död sond rapporterar framgång.
          set -o pipefail
          mkdir -p ops
          node scripts/diag-reveal-fleet.mjs | tee ops/diag-reveal-fleet.txt
      - name: Spara utfallet som artefakt
        # main tar bara emot PR:er (PR #80). Saknas filen blir steget rött (MP-03).
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diag-reveal-fleet-${{ github.run_id }}-${{ github.run_attempt }}
          path: ops/diag-reveal-fleet.txt
          if-no-files-found: error
          retention-days: 90
