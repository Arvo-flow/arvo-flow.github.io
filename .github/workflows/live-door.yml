name: Live door (Lekia-beviset)
# Kör grundarens eget test mot skarpa dörren och fotar svaret. Självtriggar på skript-push.
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/live-door-lekia.mjs'
permissions:
  contents: write
jobs:
  door:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Playwright + Chromium
        run: |
          npm install --no-save playwright
          npx playwright install chromium --with-deps
      - name: Vänta in Vercel-deployen av samma push
        run: sleep 110
      - name: Kör dörren med Lekia
        run: |
          set -o pipefail
          mkdir -p ops/door-shots
          node scripts/live-door-lekia.mjs 2>&1 | tee ops/door-shots/logg.txt
      # BEVISET FÅR INTE TAPPAS BORT (2026-08-07): steget gjorde `git pull --rebase` med osparade
      # ändringar (fel varje gång) och sedan EN push som förlorade varje kapplöpning mot en
      # nyare main — "push miss", och dörrens mätning fanns ingenstans. En vakt vars protokoll
      # tyst försvinner är lika illa som en vakt som tiger. Nu: spara filerna FÖRST, hämta
      # senaste main, lägg bara ops/ ovanpå, och försök igen med backoff.
      # ── BEVISET FÅR INTE TAPPAS BORT, PÅ RIKTIGT DEN HÄR GÅNGEN (2026-08-12) ──────────────
      # Föregående version stashade med -u och plockade tillbaka med `git checkout stash@{0} --`.
      # Untracked filer bor i stash@{0}^3, inte i stash-trädet — så BEFINTLIGA bilder uppdaterades
      # medan NYA föll bort tyst. Första körningen med ett nytt fall (castra) sparade alltså
      # loggen som sa "✓ castra mobil" men inte bilden den syftade på. Ett bevis för ett nytt fall
      # är precis när bilden behövs mest.
      #
      # Nu kopieras filerna UT ur repot innan grenbytet och tillbaka efteråt — samma mönster som
      # sondflottan, där det har hållit. Och continue-on-error är borta: förloras beviset ska
      # körningen vara röd, annars är den här vakten en till som ser ut att titta.
      - name: Commit
        if: always()
        run: |
          git config user.email "bot@arvoflow.se"
          git config user.name "Arvo Diag Bot"
          mkdir -p /tmp/door-bevis && cp -a ops/door-shots/. /tmp/door-bevis/
          ANTAL=$(ls -1 /tmp/door-bevis | wc -l)
          echo "bevis att spara: $ANTAL fil(er)"
          SPARAT=0
          for i in 1 2 3 4 5; do
            git fetch origin main
            git checkout -f -B ops-tmp origin/main
            mkdir -p ops/door-shots && cp -a /tmp/door-bevis/. ops/door-shots/
            git add ops/door-shots/
            git commit -m "ops: live-door [skip ci]" || echo "inget nytt"
            if git push origin HEAD:main; then echo "protokollet sparat"; SPARAT=1; break; fi
            echo "kapplöpning förlorad — försök $i"; sleep $((i * 6))
          done
          [ "$SPARAT" = "1" ] || { echo "✗ dörrbeviset kunde INTE sparas"; exit 1; }
