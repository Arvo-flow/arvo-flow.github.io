name: Live door (Lekia-beviset)
# Kör grundarens eget test mot skarpa dörren och fotar svaret. Självtriggar på skript-push.
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/live-door-lekia.mjs'
permissions:
  contents: read
jobs:
  door:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Playwright + Chromium
        run: |
          npm install --no-save playwright
          npx playwright install chromium --with-deps
      - name: Vänta in Vercel-deployen av samma push
        run: sleep 110
      - name: Kör dörren med Lekia
        run: |
          set -o pipefail
          mkdir -p ops/door-shots
          node scripts/live-door-lekia.mjs 2>&1 | tee ops/door-shots/logg.txt
      # BEVISET FÅR INTE TAPPAS BORT (2026-08-07, -08-12): två versioner av en push till main
      # tappade dörrens bilder tyst — först en kapplöpning som svaldes av `|| echo`, sedan en
      # stash som lämnade NYA filer kvar. Sedan PR #80 tar main bara emot PR:er, så bilderna
      # blir en artefakt i stället. Inget continue-on-error: förloras beviset ska körningen vara röd.
      - name: Spara utfallet som artefakt
        # main tar bara emot PR:er (PR #80). Saknas filen blir steget rött (MP-03).
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-door-${{ github.run_id }}-${{ github.run_attempt }}
          path: ops/door-shots/
          if-no-files-found: error
          retention-days: 30
