name: Sond · koncernraden (säger registret verkligen Skanska Kraft AB?)
# 'Er Microsoft 365 sattes upp oktober 2007' är dörrens vassaste rad och den fyrar 2 av 28.
# Sonden skiljer tre helt olika orsaker åt: crt.sh svarar inte i tid (budgetfråga), domänen har
# aldrig haft ett M365-cert (verklighetsgräns), eller vårt fingeravtryck missar ett cert som finns
# (vår bugg). Skillnaden avgör om raden är en möjlighet eller ett tak.
permissions:
  contents: write
on:
  workflow_dispatch:
jobs:
  sond:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: |
          set -o pipefail
          node scripts/probe-koncernraden.mjs 2>&1 | tee /tmp/koncern.txt
      # Inget continue-on-error: går mätningen förlorad ska körningen vara röd.
      - name: Spara sondsvaret
        if: always()
        run: |
          git config user.email "bot@arvoflow.se"
          git config user.name "Arvo Diag Bot"
          for i in 1 2 3; do
            git fetch origin main
            git checkout -B sond origin/main
            mkdir -p ops && cp /tmp/koncern.txt ops/probe-koncernraden.txt
            git add ops/probe-koncernraden.txt
            git commit -m "ops: sond koncernraden [skip ci]" || echo "inget nytt"
            if git push origin HEAD:main; then echo "sondsvaret sparat"; SPARAT=1; break; fi
            sleep $((i * 6))
          done
          [ "${SPARAT:-0}" = "1" ] || { echo "✗ sondsvaret kunde INTE sparas"; exit 1; }
