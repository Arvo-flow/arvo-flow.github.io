name: Sond — publik prislista (prisdata-flottan)

# En sond för hela flottan. Kör den per leverantör; utfallet laddas upp som artefakt.
# Kanariefågeln (Loopia) saknade skrivrättighet och kunde inte spara sitt utfall — resultatet
# fanns bara i körloggen, och loggar roterar. Sedan PR #80 tar main bara emot PR:er, så
# artefakten är vägen ut. Ska utfallet bli en källa i ops/prislistor/, går det in via en PR.
on:
  workflow_dispatch:
    inputs:
      leverantor:
        description: 'Leverantörens namn (t.ex. Binero)'
        required: true
      kategori:
        description: 'Kategorinyckel (t.ex. serverhosting)'
        required: true
      urler:
        description: 'Kommaseparerade prissidor — PRISSIDOR, inte översiktssidor'
        required: true

permissions:
  contents: read

jobs:
  sond:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Playwright + Chromium
        run: npm install playwright && npx playwright install chromium --with-deps
      - name: Mät prislistan
        id: matning
        shell: bash
        env:
          PRIS_LEVERANTOR: ${{ inputs.leverantor }}
          PRIS_KATEGORI: ${{ inputs.kategori }}
          PRIS_URLER: ${{ inputs.urler }}
        # pipefail: utan den är stegets exit-kod tee:s (alltid 0) — en död sond rapporterar framgång.
        run: |
          set -o pipefail
          mkdir -p ops/prislistor
          namn=$(echo "${{ inputs.leverantor }}" | tr '[:upper:] ' '[:lower:]-' | tr -cd 'a-z0-9-')
          # Före sonden: dör den skrivs ändå sökvägen, och uppladdningen tar det som hann skrivas.
          echo "fil=ops/prislistor/$namn.txt" >> "$GITHUB_OUTPUT"
          node scripts/probe-prislista.mjs 2>&1 | tee "ops/prislistor/$namn.txt"
      - name: Spara utfallet som artefakt
        # main tar bara emot PR:er (PR #80). Saknas filen blir steget rött (MP-03).
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: probe-prislista-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.matning.outputs.fil }}
          if-no-files-found: error
          retention-days: 90
