name: Probe Bolagsverket
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/probe-bolagsverket.mjs'
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Probe
        run: |
          # pipefail: utan den är stegets exit-kod tee:s (alltid 0) — en död sond rapporterar framgång.
          set -o pipefail
          mkdir -p ops
          node scripts/probe-bolagsverket.mjs | tee ops/probe-bolagsverket.txt
      - name: Spara utfallet som artefakt
        # main tar bara emot PR:er (PR #80). Saknas filen blir steget rött (MP-03).
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: probe-bolagsverket-${{ github.run_id }}-${{ github.run_attempt }}
          path: ops/probe-bolagsverket.txt
          if-no-files-found: error
          retention-days: 90
