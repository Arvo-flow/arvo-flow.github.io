name: Sond — CRON_SECRET i produktionen

# Mäter TVÅ saker oberoende: att variabeln finns (health), och att grinden faktiskt STÄNGER
# (drain-ingest nekar en tom bärartoken). Den andra är den bärande — en satt variabel som
# deployen inte plockat upp ser i health ut precis som en fungerande konfiguration.
# Skickar aldrig ett hemligt värde; sonden prövar exakt det fall som ska nekas.
on:
  workflow_dispatch:
  push:
    paths:
      - 'ops/cronsecret.trigger'

permissions:
  contents: read

jobs:
  sond:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Mät
        shell: bash
        # pipefail: utan den returnerar en pipe TEE:s exit-kod och en död sond rapporterar framgång.
        run: |
          set -o pipefail
          node scripts/probe-cronsecret.mjs
