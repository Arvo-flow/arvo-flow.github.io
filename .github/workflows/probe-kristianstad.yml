name: Probe Kristianstad (bokslutsdiagnosen)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      # Sonden kör dörrens RIKTIGA moduler (lib/business-intel + lib/domain-intel), inte en
      # kopia av dem — därför behövs beroendena, till skillnad från de fristående sonderna.
      - name: Install deps
        run: npm ci --ignore-scripts
      - name: Probe
        run: |
          # pipefail: utan den är stegets exit-kod tee:s (alltid 0) — en död sond rapporterar framgång.
          set -o pipefail
          mkdir -p ops
          node scripts/probe-kristianstad.mjs 2>&1 | tee ops/probe-kristianstad.txt
      - name: Spara utfallet som artefakt
        # main tar bara emot PR:er (PR #80). Saknas filen blir steget rött (MP-03).
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: probe-kristianstad-${{ github.run_id }}-${{ github.run_attempt }}
          path: ops/probe-kristianstad.txt
          if-no-files-found: error
          retention-days: 90
