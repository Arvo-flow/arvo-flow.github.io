name: Sond — lagrade kundtexter (skrivskyddad, produktions-DB)

# Skrivskyddad mätning 2026-09-24: bär lagrade kundtexter (briefingar, fynd) förbjudna former?
# Går via DATABASE_URL — mät datan, inte HTTP-routen.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sond:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci --omit=dev
      - name: Skanna lagrade kundtexter mot registret
        shell: bash
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        # pipefail: utan den returnerar en pipe TEE:s exit-kod och en död sond rapporterar framgång.
        run: |
          set -o pipefail
          node scripts/probe-lagrade-kundtexter.mjs
