name: Probe identitet (vilken väg fyrade?)
on:
  workflow_dispatch:
    inputs:
      domaner:
        description: 'Domäner, mellanslagsseparerade'
        default: 'avida.se'
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20', cache: npm }
      - run: npm ci --ignore-scripts
      - name: Probe
        continue-on-error: true
        run: |
          # pipefail: utan den är stegets exit-kod tee:s (alltid 0) — en död sond rapporterar framgång.
          set -o pipefail
          mkdir -p ops
          node scripts/probe-identitet.mjs ${{ inputs.domaner }} 2>&1 | tee ops/probe-identitet.txt
      - name: Spara utfallet som artefakt
        # main tar bara emot PR:er (PR #80). Saknas filen blir steget rött (MP-03).
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: probe-identitet-${{ github.run_id }}-${{ github.run_attempt }}
          path: ops/probe-identitet.txt
          if-no-files-found: error
          retention-days: 90
