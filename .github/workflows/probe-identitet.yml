name: Probe identitet (vilken väg fyrade?)
on:
  workflow_dispatch:
    inputs:
      domaner:
        description: 'Domäner, mellanslagsseparerade'
        default: 'avida.se'
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20', cache: npm }
      - run: npm ci --ignore-scripts
      - name: Probe
        continue-on-error: true
        run: |
          # pipefail: utan den är stegets exit-kod tee:s (alltid 0) — en död sond rapporterar framgång.
          set -o pipefail
          mkdir -p ops
          node scripts/probe-identitet.mjs ${{ inputs.domaner }} 2>&1 | tee ops/probe-identitet.txt
      - name: Commit
        # ⚠️ ENDAST FRÅN main (2026-09-10). Utan villkoret pushar ett workflow_dispatch på en
        #    feature branch DEN BRANCHEN till main — tyst (`|| echo`), förbi granskningsgrinden.
        if: always() && github.ref == 'refs/heads/main'
        continue-on-error: true
        run: |
          git config user.email "bot@arvoflow.se"
          git config user.name "Arvo Probe Bot"
          git pull --rebase origin main || true
          git add ops/probe-identitet.txt
          git commit -m "ops: probe-identitet [skip ci]" || echo "inget"
          git push origin HEAD:main || echo "push miss"
