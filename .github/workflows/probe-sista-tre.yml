name: Probe sista tre (Atlassian seats · Pipedrive · Fortnox)
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20', cache: npm }
      - name: Install Playwright + Chromium
        run: |
          npm ci
          npm install playwright
          npx playwright install chromium --with-deps
      - name: Probe
        continue-on-error: true
        run: |
          mkdir -p ops
          node scripts/probe-sista-tre.mjs 2>&1 | tee ops/probe-sista-tre.txt
      - name: Commit
        if: always()
        continue-on-error: true
        run: |
          git config user.email "bot@arvoflow.se"
          git config user.name "Arvo Probe Bot"
          git pull --rebase origin main || true
          git add ops/probe-sista-tre.txt
          git commit -m "ops: probe-sista-tre [skip ci]" || echo "inget"
          git push origin HEAD:main || echo "push miss"
