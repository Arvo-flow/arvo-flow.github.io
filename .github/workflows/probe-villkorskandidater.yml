name: Sond · villkorskandidater (inför bokens utbyggnad)
# Rekognoscering, inte kurering. Svarar på: finns ett FÖRETAGSvillkorsdokument, vilken
# dokumentklass är det, och var ligger distributionspunkten. Kurerar aldrig något.
on:
  workflow_dispatch:
jobs:
  sond:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/probe-villkorskandidater.mjs 2>&1 | tee ops/probe-villkorskandidater.txt
      - name: Spara sondsvaret
        if: always()
        continue-on-error: true
        run: |
          git config user.email "bot@arvoflow.se"
          git config user.name "Arvo Diag Bot"
          for i in 1 2 3; do
            git fetch origin main
            git stash -u -- ops/ 2>/dev/null || true
            git checkout -B sond origin/main
            git checkout stash@{0} -- ops/ 2>/dev/null || git stash pop || true
            git add ops/probe-villkorskandidater.txt
            git commit -m "ops: sond villkorskandidater [skip ci]" || echo "inget nytt"
            if git push origin HEAD:main; then echo "sondsvaret sparat"; break; fi
            sleep $((i * 6))
          done
