name: Sond · villkorskandidater (inför bokens utbyggnad)
# Rekognoscering, inte kurering. Svarar på: finns ett FÖRETAGSvillkorsdokument, vilken
# dokumentklass är det, och var ligger distributionspunkten. Kurerar aldrig något.
# Utan detta block har github-actions[bot] ingen skrivrätt: spara-steget föll på 403 i tre
# försök och sondsvaret gick förlorat — trots att jobbet lyste grönt.
permissions:
  contents: write
on:
  workflow_dispatch:
jobs:
  sond:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright && npx playwright install chromium --with-deps
      # Skriv UTANFÖR repot: föregående version stashade filen och tappade den i checkouten,
      # varpå git add föll med exit 128 — svalt av continue-on-error, och jobbet blev grönt ändå.
      - run: |
          set -o pipefail
          node scripts/probe-villkorskandidater.mjs 2>&1 | tee /tmp/sond.txt
      # continue-on-error TOGS BORT 2026-08-10: tanden satt bara på loggraden. Steget skrev
      # visserligen "✗ sondsvaret kunde INTE sparas" och avslutade med exit 1 — men jobbet blev
      # ändå grönt, och ett förlorat bevis bakom en grön bock är precis den sjukdom vi jagar.
      # Går beviset förlorat ska körningen vara röd.
      - name: Spara sondsvaret
        if: always()
        run: |
          git config user.email "bot@arvoflow.se"
          git config user.name "Arvo Diag Bot"
          for i in 1 2 3; do
            git fetch origin main
            git checkout -B sond origin/main
            mkdir -p ops && cp /tmp/sond.txt ops/probe-villkorskandidater.txt
            git add ops/probe-villkorskandidater.txt
            git commit -m "ops: sond villkorskandidater [skip ci]" || echo "inget nytt"
            if git push origin HEAD:main; then echo "sondsvaret sparat"; SPARAT=1; break; fi
            sleep $((i * 6))
          done
          # En tyst förlust av sondsvaret är samma sjukdom som en tyst vakt: säg ifrån.
          [ "${SPARAT:-0}" = "1" ] || { echo "✗ sondsvaret kunde INTE sparas"; exit 1; }
