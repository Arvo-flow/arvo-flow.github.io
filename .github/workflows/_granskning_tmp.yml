name: Granskning tmp ECB parse

on:
  workflow_dispatch:
  push:
    branches: [granskning3-tmp-ecb]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Mät
        run: node scripts/_granskning_tmp_ecb_parse.mjs
