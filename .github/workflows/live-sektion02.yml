name: Live sektion 02 (rummet)
# Fotar 02 · Arvo-kontoret i båda lägen mot skarpa sajten. Självtriggar på skript-push.
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/live-sektion02.mjs'
permissions:
  contents: read
jobs:
  shoot:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Playwright + Chromium
        run: |
          npm install --no-save playwright
          npx playwright install chromium --with-deps
      - name: Vänta in Vercel-deployen av samma push
        run: sleep 120
      - name: Fota sektion 02
        run: |
          set -o pipefail
          mkdir -p ops/sek02-shots
          node scripts/live-sektion02.mjs 2>&1 | tee ops/sek02-shots/logg.txt
      - name: Spara utfallet som artefakt
        # main tar bara emot PR:er (PR #80). Saknas filen blir steget rött (MP-03).
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-sektion02-${{ github.run_id }}-${{ github.run_attempt }}
          path: ops/sek02-shots/
          if-no-files-found: error
          retention-days: 30
