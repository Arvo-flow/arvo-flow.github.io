name: Live avtal-uppladdning (skarpa rummet, fotograferad)
# Riktig uppladdning genom arvoflow.se/portfolio med Playwright — bilderna laddas upp som
# artefakt. Självtriggar på skript-push (aldrig [skip ci] i den committen).
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/live-avtal-screenshot.mjs'
permissions:
  contents: read
jobs:
  shots:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Playwright + Chromium
        run: |
          # pipefail: utan den är stegets exit-kod tee:s (alltid 0) — en död sond rapporterar framgång.
          set -o pipefail
          npm install --no-save playwright
          npx playwright install chromium --with-deps
      - name: Vänta in ev. pågående Vercel-deploy
        run: sleep 90
      - name: Kör den riktiga uppladdningen
        run: |
          mkdir -p ops/live-avtal-shots
          node scripts/live-avtal-screenshot.mjs | tee ops/live-avtal-shots/logg.txt
      - name: Spara utfallet som artefakt
        # main tar bara emot PR:er (PR #80). Saknas filen blir steget rött (MP-03).
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-avtal-shots-${{ github.run_id }}-${{ github.run_attempt }}
          path: ops/live-avtal-shots/
          if-no-files-found: error
          retention-days: 30
