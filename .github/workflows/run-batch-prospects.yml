name: Generera prospect-briefingar

# Kör score-leads → batch-prospects → visar URLs i Summary.
# Prospect-sidor visas på arvo-flow.se/prospect/:token
#
# Kräver GitHub Secret: ARVO_ADMIN_SECRET (samma värde som i Vercel)
#
# Manuell körning: Actions → "Generera prospect-briefingar" → Run workflow

on:
  workflow_dispatch:
    inputs:
      csv_file:
        description: 'CSV med leads (default: leads/stockholm-leads.csv)'
        required: false
        default: 'leads/stockholm-leads.csv'
      send_email:
        description: 'Skicka mail till contact_email (ja/nej)'
        required: false
        default: 'nej'
      only:
        description: 'Generera enbart bolag vars namn innehåller (t.ex. lynxeye) — för granskning'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  generate-prospects:
    name: Score leads → Generera prospect-URLs
    environment: produktion
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Kör score-leads (generera scored CSV)
        run: |
          # pipefail: utan den är stegets exit-kod tee:s (alltid 0) — en död sond rapporterar framgång.
          set -o pipefail
          FILE="${{ github.event.inputs.csv_file || 'leads/stockholm-leads.csv' }}"
          echo "Kör mot: $FILE"
          node scripts/score-leads.mjs "$FILE" 2>&1 | tee /tmp/score-output.txt
          # Hitta senaste scored CSV
          SCORED=$(ls results/scored-*.csv 2>/dev/null | sort | tail -1)
          echo "scored_csv=$SCORED" >> "$GITHUB_ENV"
          echo "Scorad fil: $SCORED"

      - name: Kör batch-prospects (generera URLs)
        env:
          ARVO_ADMIN_SECRET: ${{ secrets.ARVO_ADMIN_SECRET }}
          BASE_URL: 'https://arvoflow.se'
        run: |
          SCORED="${{ env.scored_csv }}"
          if [ -z "$SCORED" ] || [ ! -f "$SCORED" ]; then
            echo "Ingen scored CSV hittades — avbryter"
            exit 1
          fi

          SEND_EMAIL="${{ github.event.inputs.send_email || 'nej' }}"
          NO_EMAIL_FLAG="--no-email"
          if [ "$SEND_EMAIL" = "ja" ]; then
            NO_EMAIL_FLAG=""
          fi

          ONLY="${{ github.event.inputs.only || '' }}"
          ONLY_FLAG=""
          if [ -n "$ONLY" ]; then ONLY_FLAG="--only=$ONLY"; fi

          echo "Kör batch-prospects mot: $SCORED $ONLY_FLAG"
          node scripts/batch-prospects.mjs "$SCORED" $NO_EMAIL_FLAG $ONLY_FLAG --rate=30000 2>&1 | tee /tmp/batch-output.txt

      - name: Visa prospect-URLs i Summary
        run: |
          echo "## Prospect-briefingar skapade" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Öppna länkarna nedan för att se vad respektive bolag ser:" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          # Extrahera URLs — stöd för arvoflow.se (utan bindestreck)
          grep -oE 'https://arvoflow\.se/prospect/[a-zA-Z0-9_-]+' /tmp/batch-output.txt | while read url; do
            company=$(grep "$url" /tmp/batch-output.txt | grep -oP '^\[\d+/\d+\] \K[^(]+' | head -1 | xargs)
            echo "- **${company}** — $url" >> "$GITHUB_STEP_SUMMARY"
          done

          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "---" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat /tmp/batch-output.txt >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Hämta dossier-payload för granskning
        id: granskning
        if: github.event.inputs.only != ''
        run: |
          TOKEN=$(grep -oE 'https://arvoflow\.se/prospect/[a-zA-Z0-9_-]+' /tmp/batch-output.txt | head -1 | sed 's|.*/||')
          if [ -z "$TOKEN" ]; then echo "ingen token hittad — ingen payload att spara"; exit 0; fi
          curl -sSf "https://arvoflow.se/api/prospect?token=$TOKEN" -o ops/prospect-review.json
          echo "{\"token\": \"$TOKEN\"}" > ops/prospect-review-token.json
          echo "hamtad=ja" >> "$GITHUB_OUTPUT"

      - name: Spara utfallet som artefakt
        # main tar bara emot PR:er (PR #80). Saknas filen blir steget rött (MP-03).
        if: steps.granskning.outputs.hamtad == 'ja'
        uses: actions/upload-artifact@v4
        with:
          name: run-batch-prospects-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ops/prospect-review.json
            ops/prospect-review-token.json
          if-no-files-found: error
          retention-days: 7
