name: Skrapa — publikt SEK-referenspris för en tyst kategori

# Hämtar ett publikt SEK-listpris och lägger fram ett UNDERLAG. Skriver ALDRIG till prisboken:
# «verifierat» måste förtjänas av en människa som öppnar sidan.
#
# Körs här och inte lokalt eftersom sandlådan saknar nät-egress — samma skäl som
# price-monitor.mjs. Playwright + Chromium installeras explicit.
#
# FAIL-CLOSED: ändrad DOM, tvetydigt pris, kampanj-/bindnings-/enhetskvalificerare eller oskriven
# momsbas ger exit 1 med namngivet skäl. Ett rött här är ett korrekt utfall, aldrig ett fel att
# runda av — Fortnox egen prislista bär en kvalificerare i klartext.
on:
  workflow_dispatch:
    inputs:
      kategori:
        description: 'Kategori att skrapa (kända: faktura-tjanst)'
        required: false
        default: 'faktura-tjanst'

permissions:
  contents: read

jobs:
  skrapa:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci --omit=dev --ignore-scripts
      # ⚠️ `playwright` finns INTE i package.json — granskaren mätte det. Utan den här raden
      # kastar `await import('playwright')`, och skriptet hade skrivit «rätt utfall» på ett
      # verktygsfel: noll rekognosering förklädd till en mätning. Samma mönster som
      # price-monitor.yml använder.
      - name: Installera Playwright + Chromium
        run: |
          npm install playwright
          npx playwright install --with-deps chromium
      - name: Hämta referenspriset
        shell: bash
        env:
          SKRAP_KATEGORI: ${{ inputs.kategori || 'faktura-tjanst' }}
        # pipefail: utan den returnerar en pipe tee:s exit-kod och en död skrapa rapporterar framgång.
        run: |
          set -o pipefail
          node scripts/skrapa-prislista.mjs
