name: Probe fakturanummer
# Ljuger modellen om fakturanumret? Prövar modellens påstående mot dokumentets TEXTLAGER
# (pdfjs, deterministiskt) över hela korpusen. Skriver ingenting, rör inte produktionen.
on:
  workflow_dispatch:
    inputs:
      max_pdf:
        description: 'Antal fakturor att pröva (tomt = alla)'
        required: false
permissions:
  contents: read
jobs:
  probe:
    environment: produktion
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: npm ci
      # pdfjs-dist är inte en produktionsdependency (bundlestorleken är inte värd ett fält) —
      # den installeras bara där mätningen körs, precis som i forsegla-villkor.
      - run: npm install --no-save pdfjs-dist
      - name: Mät
        run: |
          # pipefail: utan den är stegets exit-kod tee:s (alltid 0) — en död sond rapporterar framgång.
          set -o pipefail
          mkdir -p ops
          node scripts/probe-fakturanummer.mjs 2>&1 | tee ops/fakturanummer.txt
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          MAX_PDF: ${{ inputs.max_pdf }}
      - name: Spara utfallet som artefakt
        # main tar bara emot PR:er (PR #80). Saknas filen blir steget rött (MP-03).
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: probe-fakturanummer-${{ github.run_id }}-${{ github.run_attempt }}
          path: ops/fakturanummer.txt
          if-no-files-found: error
          retention-days: 90
