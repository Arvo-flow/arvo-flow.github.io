name: Probe identitet · täckning vs sanning
on:
  workflow_dispatch:
    inputs:
      fil:
        description: 'Leads-fil med facit'
        default: 'leads/stockholm-leads.csv'
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20', cache: npm }
      - run: npm ci --ignore-scripts
      - name: Probe
        continue-on-error: true
        run: |
          # pipefail: utan den är stegets exit-kod tee:s (alltid 0) — en död sond rapporterar framgång.
          set -o pipefail
          mkdir -p ops
          node scripts/probe-identitet-tackning.mjs ${{ inputs.fil }} 2>&1 | tee ops/probe-identitet-tackning.txt
      - name: Spara utfallet som artefakt
        # main tar bara emot PR:er (PR #80). Saknas filen blir steget rött (MP-03).
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: probe-identitet-tackning-${{ github.run_id }}-${{ github.run_attempt }}
          path: ops/probe-identitet-tackning.txt
          if-no-files-found: error
          retention-days: 90
